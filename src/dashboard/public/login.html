<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Connexion — Dashboard Modmail</title>
<link rel="stylesheet" href="/css/style.css" />
<style>
  .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .login-card { width: 100%; max-width: 380px; text-align: center; }
  .login-mark { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--text-soft); letter-spacing: .08em; margin-bottom: 10px; }
  .login-card h1 { font-size: 22px; margin: 0 0 8px; }
  .login-card p { color: var(--text-soft); font-size: 13.5px; margin: 0 0 28px; line-height: 1.5; }
  .discord-btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 10px;
    width: 100%; padding: 12px 18px; font-size: 14.5px; font-weight: 600;
  }
</style>
</head>
<body>
  <div class="login-wrap">
    <div class="login-card panel">
      <div class="login-mark">MODMAIL / ADMIN</div>
      <h1>Accès au dashboard</h1>
      <p>Réservé à l'équipe. Connecte-toi avec le compte Discord autorisé pour gérer les catégories, réponses et paramètres du bot.</p>
      <a href="/auth/login" class="btn primary discord-btn">Se connecter avec Discord</a>
    </div>
  </div>
</body>
</html>
